name: Publish Trazos.UI NuGet Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'packages/tokens/*.css'
      - '.github/workflows/publish-trazos-nuget.yml'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/Trazos.UI/Trazos.UI.csproj

      - name: Build Trazos.UI
        run: dotnet build src/Trazos.UI/Trazos.UI.csproj -c Release --no-restore

      - name: Pack NuGet Package
        run: dotnet pack src/Trazos.UI/Trazos.UI.csproj -c Release --no-build -o ./nupkg

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
