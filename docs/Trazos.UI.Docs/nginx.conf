server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # dotnet publish emits .gz siblings for the static assets.
    gzip_static on;

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing framework files must fail, not return the app shell.
    location /_framework/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
