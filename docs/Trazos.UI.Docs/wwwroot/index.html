<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Documentation for Trazos.UI, a warm, hand-crafted Blazor component library." />
    <meta name="theme-color" content="#FAF7F2" />
    <title>Trazos.UI</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="_content/Trazos.UI/trazos.css" />
    <link rel="stylesheet" href="Trazos.UI.Docs.styles.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        window.trazosDocs = {
            getLanguage: function () {
                try {
                    var saved = localStorage.getItem('trazos-docs-lang');
                    if (saved === 'en' || saved === 'es') return saved;
                } catch (e) { }
                return (navigator.language || 'en').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
            },
            applyLanguage: function (lang, persist) {
                document.documentElement.lang = lang;
                if (!persist) return;
                try { localStorage.setItem('trazos-docs-lang', lang); } catch (e) { }
            }
        };
        // Set the language before the first paint so nothing flashes.
        document.documentElement.lang = window.trazosDocs.getLanguage();
    </script>
    <script src="_content/Trazos.UI/trazos-theme.js" data-storage-key="trazos-docs-theme"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="docs-boot" id="docs-boot">Loading Trazos.UI…</div>
        <script>
            if (document.documentElement.lang === 'es') document.getElementById('docs-boot').textContent = 'Cargando Trazos.UI…';
        </script>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
